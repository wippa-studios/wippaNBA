# Dependabot configuration for wippaNBA.
#
# This repository is a fork of kyleskom/NBA-Machine-Learning-Sports-Betting
# by Kyle Skompinski and contributors.
#
# SUPPORTED PYTHON VERSIONS: 3.10 and 3.11 ONLY. The ceiling is deliberate,
# not an oversight: requires-python = ">=3.10,<3.12" in pyproject.toml, because
# tensorflow==2.14.0 publishes cp39/cp310/cp311 wheels only (its own metadata
# claims >=3.9, so on 3.12+ pip attempts an sdist build and fails), and
# pandas==2.1.1 / scikit-learn==1.3.1 have no cp313 wheels either. Bumping
# TensorFlow past 2.14 is a code-and-artifact migration — Keras 3 (TF 2.16+)
# removed the legacy optimizers the trainers call — not a pin bump. See the
# comment at the top of requirements.txt.
#
# Dependabot will still open version-update PRs against exact pins such as
# tensorflow==2.14.0. Until that migration lands, close those PRs rather than
# merging them: the pins move together with the Python ceiling, by design.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
